name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # Jobs read the source unless they raise their own permissions.
  checks: read # Verify the installed Hard Eng release.

env:
  RUST_TOOLCHAIN: stable

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Rust and npm checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scaffold_only: ${{ steps.scaffold.outputs.scaffold_only }}
      npm_exists: ${{ steps.state.outputs.npm_exists }}
      tag_exists: ${{ steps.state.outputs.tag_exists }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false

      - name: Verify scaffold-only maintenance
        id: scaffold
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          MISE_FETCH_REMOTE_VERSIONS_CACHE: 0s
          MISE_PREFER_OFFLINE: 'false'
          MISE_USE_VERSIONS_HOST: 'false'
          MISE_MINIMUM_RELEASE_AGE: 0s
        run: |
          export BASE_SHA="${BASE_SHA:-$(git rev-parse HEAD^)}"
          pnpm dlx --config.ignore-scripts=false --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config install uv@latest python@3.12
          MISE_FETCH_REMOTE_VERSIONS_CACHE=1h pnpm dlx --config.ignore-scripts=false --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config exec uv@latest python@3.12 -- uv run --no-project --with pyyaml python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, '.hooks')
          from update import check_scaffold_update

          scaffold_only = check_scaffold_update(Path.cwd(), os.environ['BASE_SHA']) is True
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'scaffold_only={str(scaffold_only).lower()}\n')
          PY

      - name: Install Rust
        if: steps.scaffold.outputs.scaffold_only != 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Resolve version
        if: steps.scaffold.outputs.scaffold_only != 'true'
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release state
        if: steps.scaffold.outputs.scaffold_only != 'true'
        id: state
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag_commit="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"
          if [ -n "$tag_commit" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$tag_commit" = "$GITHUB_SHA" ]; then
            echo "tag_points_at_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_points_at_head=false" >> "$GITHUB_OUTPUT"
          fi

          if pnpm view "dart-decimate@$VERSION" version >/dev/null 2>&1; then
            echo "npm_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject reused release tag
        if: steps.state.outputs.tag_exists == 'true' && steps.state.outputs.tag_points_at_head == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "$TAG already exists on a different commit; bump Cargo.toml and package.json"
          exit 1

      - name: Reject reused package version
        if: steps.state.outputs.npm_exists == 'true' && steps.state.outputs.tag_points_at_head == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "dart-decimate@$VERSION is already published; bump Cargo.toml and package.json"
          exit 1

      - name: Validate release candidate
        if: steps.scaffold.outputs.scaffold_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          DART_DECIMATE_ALLOW_EXISTING_VERSION: ${{ steps.state.outputs.npm_exists == 'true' && steps.state.outputs.tag_points_at_head == 'true' && '1' || '0' }}
          MISE_FETCH_REMOTE_VERSIONS_CACHE: 0s
          MISE_PREFER_OFFLINE: 'false'
          MISE_USE_VERSIONS_HOST: 'false'
          MISE_MINIMUM_RELEASE_AGE: 0s
        run: |
          export BASE_SHA="${BASE_SHA:-$(git rev-parse HEAD^)}"
          MISE_FETCH_REMOTE_VERSIONS_CACHE=1h pnpm dlx --config.ignore-scripts=false --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config exec uv@latest python@3.12 -- uv run --no-project --with pyyaml python .hooks/hard-eng.py check --base "$BASE_SHA"

  build-assets:
    name: Build ${{ matrix.asset }}
    needs: prepare
    if: needs.prepare.outputs.scaffold_only != 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dart-decimate-linux-x64.tar.gz
            exe_ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: dart-decimate-darwin-x64.tar.gz
            exe_ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            asset: dart-decimate-darwin-arm64.tar.gz
            exe_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dart-decimate-windows-x64.tar.gz
            exe_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify release source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$TARGET"

      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE_EXT: ${{ matrix.exe_ext }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" --bin dart-decimate --bin dart-decimate-mcp
          mkdir -p dist
          cp "target/$TARGET/release/dart-decimate$EXE_EXT" dist/
          cp "target/$TARGET/release/dart-decimate-mcp$EXE_EXT" dist/
          if [ "$EXE_EXT" = "" ]; then
            chmod +x dist/dart-decimate dist/dart-decimate-mcp
          fi
          tar -czf "$ASSET" -C dist .

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish tagged source
    needs: [prepare, build-assets]
    if: needs.prepare.outputs.scaffold_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # Push the release tag and create the GitHub release.
      id-token: write # Publish to npm with provenance through trusted publishing.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Install Node and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false

      - name: Verify release source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p dist-assets
          find release-assets -type f -name 'dart-decimate-*' -exec cp {} dist-assets/ \;
          test "$(find dist-assets -type f | wc -l)" -eq 4
          ls -la dist-assets

      - name: Verify Cargo and npm install parity
        env:
          DART_DECIMATE_CARGO_GIT_URL: ${{ github.server_url }}/${{ github.repository }}
          DART_DECIMATE_CARGO_REV: ${{ github.sha }}
          DART_DECIMATE_RELEASE_ASSET_DIR: dist-assets
        run: node tests/npm/test-release-install-parity.js

      - name: Create and push verified tag
        if: needs.prepare.outputs.tag_exists == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # The checkout does not persist credentials, so pass the token for this push only.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$TAG"

      - name: Verify tagged source
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-assets/* --clobber
          else
            gh release create "$TAG" dist-assets/* --title "$TAG" --notes "Dart Decimate $VERSION"
          fi

      - name: Publish to npm
        if: needs.prepare.outputs.npm_exists == 'false'
        run: pnpm publish --access public --provenance --no-git-checks --registry https://registry.npmjs.org
